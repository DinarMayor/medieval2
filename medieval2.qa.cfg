[log]
to              = logs/system.log.txt
# all log targets have 'warning' level
level           = * warning
# on missing data report everythig
level           = data.missing trace
# for system IO report only fatal errors
level           = system.io error
# debug for pre battle speech
level 					= speech.battle info
# for craig
level = eventdb info

[misc]
# saving bug reports in RETAIL configuration
bug_report      = true

[mem]
# uncomment following line for extended memory leak tracing
# leaks           = false

[video]
# uncomment next line for a windowed mode
# windowed        = true
# uncomment following line to disable movies
# movies          = false

[debug]
# enable system debug output window (so log can be grabbed with DbgView and filtered)
window          = true

[input]
# input playback
# saving of input should be enabled for QA runs
save            = true
#play            = true
play_cursor     = true
file            = reports/global.input.bin

[features]
editor          = true

