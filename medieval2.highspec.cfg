[log]
to          = logs/system.log.txt
level       = * warn
#level       = core.gfx trace
#level       = ca.gfx trace
#level       = game.cmd_line trace

[video]
windowed    = true
movies      = false
depth_shadows = 2
depth_shadows_resolution = 2
battle_resolution = 1280 1024
campaign_resolution = 1024 768
bloom = 1
texture_filtering = 2
anisotropic_level = 8
shader=2
skip_mip_levels = 0

[debug]
window      = 1

[mem]
leaks       = false

[features]
editor		= true

[misc]
auto_reload = true
nice                = 1
pr_enabled =1

[idv]
show = true
gfx = true
profile=true

[misc]
# saving bug reports in RETAIL configuration
bug_report      = true

