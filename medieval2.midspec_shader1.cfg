[log]
to          = logs/system.log.txt
level       = * warn
#level       = core.gfx trace
#level       = ca.gfx trace
#level       = game.cmd_line trace

[video]
windowed    = true
movies      = false
depth_shadows = 0
depth_shadows_resolution = 2
battle_resolution = 1024 768
campaign_resolution = 1024 768
bloom = 0
texture_filtering = 0
shader=1
skip_mip_levels = 1

[debug]
window      = 1

[mem]
leaks       = false

[features]
editor		= true

[misc]
auto_reload = true
nice                = 1
pr_enabled =1

[idv]
show = true
gfx = true
profile=true

[misc]
# saving bug reports in RETAIL configuration
bug_report      = true

