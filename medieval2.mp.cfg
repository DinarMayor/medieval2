[log]
to                      = logs/mp.log.txt
timestamp               = false
level                   = *                error
# level                   = *                fatal
level                   = game.commands    trace
level                   = sync             trace
level                   = net*             debug
file                    = game.commands    logs/gamecmd.log.txt
file                    = network.gamespy* logs/gamespy.log.txt
file                    = net*             logs/gamenet.log.txt


[video]
windowed                = 1
movies                  = false

[audio]
disabled                = true
music_enable            = false
sfx_enable              = false
speech_enable           = false

[network]
# debug.simulation        = true
debug.drop_every        = 20
debug.packet_delay_every= 40
debug.queue_delay_every = 60
# use_ip                  = 192.168.0.2
# use_port                = 49000

[misc]
nice                    = 1

[mem]
init                    = 32
leaks                   = false

[core]
# disable_dialogs         = true
# assert_ignore_always    = true

[idv]
# show                    = true
# snd                     = true

[debug]
window                  = true
no_debug_text           = true
rnd_stack_log_depth     = 10
rnd_stack_cmp_depth     = 5
world_rnd_save          = true
world_rnd_name          = temp/mp.rnd
#rnd_cmp1                = temp/mp.rnd
#rnd_cmp2                = temp/mp_.rnd
# battle_stats_save       = true
battle_stats_name       = logs/mp.stats
no_network_exe_check    = true

[replay]
save                    = true
file                    = temp/mp.rpy

[sync]
save                    = true
file                    = temp/mp.tchk

[misc]
# saving bug reports in RETAIL configuration
bug_report      = true

